<style>
:root{--cream:#f8f5ef;--ink:#514b43;--gold:#c6a64d}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Georgia,'Times New Roman',serif;text-align:center}
#sparkles{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}
.star{position:absolute;top:-16px;border-radius:50%;opacity:0;animation:fall linear infinite;box-shadow:0 0 12px 3px currentColor}
.twinkle{position:absolute;top:-16px;border-radius:50%;opacity:0;animation:fall linear infinite;box-shadow:0 0 12px 3px currentColor}
@keyframes twinkle{from{opacity:.22;transform:scale(.7)}to{opacity:1;transform:scale(1.5)}}
@keyframes fall{0%{transform:translate3d(0,-5vh,0) scale(.45) rotate(0);opacity:0}10%{opacity:.85}82%{opacity:.65}100%{transform:translate3d(var(--drift),110vh,0) scale(1.15) rotate(180deg);opacity:0}}
.transition-star{position:absolute;top:-8vh;border-radius:50%;animation:shower linear forwards;box-shadow:0 0 16px 4px currentColor}
@keyframes shower{0%{transform:translate3d(0,-8vh,0) scale(.3) rotate(0);opacity:0}12%{opacity:1}100%{transform:translate3d(var(--drift),112vh,0) scale(1.35) rotate(240deg);opacity:0}}
.screen{display:none;min-height:100svh;width:100%;padding:clamp(14px,3vw,28px) 14px 34px;position:relative;z-index:1}
.screen.active{display:flex;flex-direction:column;align-items:center;animation:show .65s ease both}
@keyframes show{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.art{display:block;width:min(100%,720px);height:auto;margin:0 auto 18px;box-shadow:0 8px 28px #4a40331c}
.controls{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:11px;margin:10px auto 16px;width:min(100%,720px)}
.action{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:12px 21px;border:1px solid #b99a58;border-radius:30px;background:#fffaf2;color:#64563e;text-decoration:none;font:12px Arial,sans-serif;letter-spacing:.04em;cursor:pointer;transition:transform .2s,background .2s}
.action:hover,.action:focus-visible{transform:translateY(-2px);background:#f1e8d7;outline:2px solid #b99a5870;outline-offset:2px}
.primary{background:#e9dfca}.eyebrow{font:11px/1.5 Arial,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#8c795b}
h1{font-size:clamp(25px,6vw,38px);font-weight:400;margin:8px 0 16px}
.countdown{width:min(100%,620px);margin:12px auto 18px;padding:19px 10px;border-top:1px solid #c6a64d66;border-bottom:1px solid #c6a64d66}
.timer{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;max-width:460px;margin:auto}
.unit{padding:10px 2px;background:#fffaf2b8;border:1px solid #c6a64d40;border-radius:8px}
.number{display:block;font:clamp(23px,6vw,33px)/1.1 Georgia,serif;color:#8c7548;font-variant-numeric:tabular-nums}
.unit small{font:10px Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#82796c}
.note{font:12px/1.6 Arial,sans-serif;color:#8a8175;margin:12px auto}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>
</head>
<body>
<div id="sparkles" aria-hidden="true"></div>

<section class="screen active" id="cover" aria-label="Portada de la invitación">
  <img class="art" src="./portada_1.jpg" alt="Portada original de la invitación al bautizo de Mateo Idai" fetchpriority="high">
</section>

<section class="screen" id="details" aria-label="Detalles del bautizo">
  <img class="art" src="./datos.jpg" alt="Página original con los detalles del bautizo de Mateo Idai" loading="lazy">
</section>

<script>
(function(){
  const layer = document.getElementById('sparkles');
  if (!layer) return;

  // Estrellas ambientales: pocas, visibles y todas con movimiento descendente.
  const colors = ['#d7b84f', '#8eafc6', '#a98768'];
  const totalStars = 18;

  for (let i = 0; i < totalStars; i++) {
    const star = document.createElement('i');
    star.className = 'star';
    star.style.left = (Math.random() * 100) + '%';
    star.style.color = colors[i % colors.length];
    star.style.width = star.style.height = (7 + Math.random() * 7) + 'px';
    star.style.animationDuration = (10 + Math.random() * 9) + 's';
    star.style.animationDelay = (-Math.random() * 18) + 's';
    star.style.setProperty('--drift', ((Math.random() - 0.5) * 90) + 'px');
    layer.appendChild(star);
  }

  // Evita errores si el contador aún no tiene sus elementos superpuestos.
  const target = new Date('2026-12-19T12:00:00-06:00').getTime();
  const ids = ['days', 'hours', 'minutes', 'seconds'];
  const message = document.getElementById('countdown-message');

  function updateCountdown() {
    const nodes = ids.map(id => document.getElementById(id));
    if (nodes.some(node => !node)) return;

    const diff = target - Date.now();
    if (diff <= 0) {
      nodes.forEach(node => node.textContent = '0');
      if (message) message.textContent = '¡Hoy celebramos el bautizo de Mateo Idai!';
      return;
    }

    const values = [
      Math.floor(diff / 86400000),
      Math.floor((diff % 86400000) / 3600000),
      Math.floor((diff % 3600000) / 60000),
      Math.floor((diff % 60000) / 1000)
    ];
    nodes.forEach((node, index) => {
      node.textContent = String(values[index]).padStart(2, '0');
    });
  }

  updateCountdown();
  window.setInterval(updateCountdown, 1000);
})();
</script>
</body></html>
