<html lang="es">
<head>

<style>
:root{--cream:#f8f5ef;--ink:#514b43;--gold:#c6a64d}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Georgia,'Times New Roman',serif;text-align:center}
#sparkles{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}
.star{position:absolute;top:-12px;border-radius:50%;opacity:0;animation:fall linear infinite;box-shadow:0 0 8px currentColor}
.twinkle{position:absolute;border-radius:50%;opacity:.25;animation:twinkle 2.8s ease-in-out infinite alternate;box-shadow:0 0 7px currentColor}
@keyframes twinkle{from{opacity:.12;transform:scale(.65)}to{opacity:.8;transform:scale(1.35)}}
@keyframes fall{0%{transform:translate3d(0,-5vh,0) scale(.45) rotate(0);opacity:0}10%{opacity:.85}82%{opacity:.65}100%{transform:translate3d(var(--drift),110vh,0) scale(1.15) rotate(180deg);opacity:0}}
.transition-star{position:absolute;top:-8vh;border-radius:50%;animation:shower linear forwards;box-shadow:0 0 12px 2px currentColor}
@keyframes shower{0%{transform:translate3d(0,-8vh,0) scale(.3) rotate(0);opacity:0}12%{opacity:1}100%{transform:translate3d(var(--drift),112vh,0) scale(1.35) rotate(240deg);opacity:0}}
.screen{display:none;min-height:100svh;width:100%;padding:clamp(14px,3vw,28px) 14px 34px;position:relative;z-index:1}
.screen.active{display:flex;flex-direction:column;align-items:center;animation:show .65s ease both}
@keyframes show{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.art{display:block;width:min(100%,720px);height:auto;margin:0 auto 18px;box-shadow:0 8px 28px #4a40331c}
.controls{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:11px;margin:10px auto 16px;width:min(100%,720px)}
.action{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:12px 21px;border:1px solid #b99a58;border-radius:30px;background:#fffaf2;color:#64563e;text-decoration:none;font:12px Arial,sans-serif;letter-spacing:.04em;cursor:pointer;transition:transform .2s,background .2s}
.action:hover,.action:focus-visible{transform:translateY(-2px);background:#f1e8d7;outline:2px solid #b99a5870;outline-offset:2px}
.primary{background:#e9dfca}.eyebrow{font:11px/1.5 Arial,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#8c795b}
h1{font-size:clamp(25px,6vw,38px);font-weight:400;margin:8px 0 16px}
.countdown{width:min(100%,620px);margin:12px auto 18px;padding:19px 10px;border-top:1px solid #c6a64d66;border-bottom:1px solid #c6a64d66}
.timer{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;max-width:460px;margin:auto}
.unit{padding:10px 2px;background:#fffaf2b8;border:1px solid #c6a64d40;border-radius:8px}
.number{display:block;font:clamp(23px,6vw,33px)/1.1 Georgia,serif;color:#8c7548;font-variant-numeric:tabular-nums}
.unit small{font:10px Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#82796c}
.note{font:12px/1.6 Arial,sans-serif;color:#8a8175;margin:12px auto}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>
</head>
<body>
<div id="sparkles" aria-hidden="true"></div>

<section class="screen active" id="cover" aria-label="Portada de la invitación">
  <img class="art" src="portada_1.jpg" alt="Portada original de la invitación al bautizo de Mateo Idai" fetchpriority="high">
  <div class="controls">
    <button class="action primary" type="button" data-open>▶ Play</button>
    <button class="action" type="button" data-open>Abrir invitación</button>
    <button class="action" type="button" data-calendar>Agendar evento</button>
  </div>
  <p class="note">Toca para abrir la invitación y conocer los detalles.</p>
</section>

<section class="screen" id="details" aria-label="Detalles del bautizo">
  <img class="art" src="datos.jpg" alt="Página original con los detalles del bautizo de Mateo Idai" loading="lazy">
  <section class="countdown" aria-label="Cuenta regresiva">
    <div class="eyebrow">Falta muy poco para celebrar</div><h1>La cuenta regresiva</h1>
    <div class="timer">
      <div class="unit"><span class="number" id="days">—</span><small>Días</small></div>
      <div class="unit"><span class="number" id="hours">—</span><small>Horas</small></div>
      <div class="unit"><span class="number" id="minutes">—</span><small>Minutos</small></div>
      <div class="unit"><span class="number" id="seconds">—</span><small>Segundos</small></div>
    </div>
    <p class="note" id="countdown-message">19 de diciembre de 2026 · 12:00 del mediodía</p>
  </section>
  <nav class="controls" aria-label="Ubicaciones">
    <a class="action" href="https://maps.app.goo.gl/ys9SZmy4LGqBp9BU8" target="_blank" rel="noopener noreferrer">Cómo llegar a la iglesia</a>
    <a class="action" href="https://maps.app.goo.gl/JEPxGaJPfs8Sdn3x7" target="_blank" rel="noopener noreferrer">Cómo llegar a la recepción</a>
    <button class="action" type="button" data-calendar>Agendar evento</button>
    <button class="action" type="button" data-cover>Volver a portada</button>
  </nav>
  <p class="note">Con cariño, te esperamos para compartir este día especial.</p>
</section>

<script>
(function(){
 const cover=document.getElementById('cover'),details=document.getElementById('details');
 function starShower(){
   const palette=['#e3bd45','#91b6d0','#a98261'];
   for(let i=0;i<58;i++){
     const s=document.createElement('i');s.className='transition-star';s.style.left=Math.random()*100+'%';s.style.color=palette[i%3];
     s.style.width=s.style.height=(3+Math.random()*5)+'px';s.style.setProperty('--drift',((Math.random()-.5)*150)+'px');
     s.style.animationDuration=(.95+Math.random()*.95)+'s';s.style.animationDelay=(Math.random()*.38)+'s';layer.appendChild(s);
     s.addEventListener('animationend',()=>s.remove(),{once:true});
   }
 }
 function showDetails(){starShower();cover.classList.remove('active');details.classList.add('active');window.scrollTo({top:0,behavior:'smooth'});}
 function showCover(){starShower();details.classList.remove('active');cover.classList.add('active');window.scrollTo({top:0,behavior:'smooth'});}
 document.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',showDetails));
 document.querySelectorAll('[data-cover]').forEach(b=>b.addEventListener('click',showCover));
 function addCalendar(){
   const start='20261219T120000',end='20261219T130000';
   const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Fezoj//Invitacion Mateo Idai//ES','CALSCALE:GREGORIAN','BEGIN:VEVENT','UID:mateo-idai-bautizo-20261219@fezoj','DTSTAMP:20260101T120000Z','DTSTART;TZID=America/Mexico_City:'+start,'DTEND;TZID=America/Mexico_City:'+end,'SUMMARY:Bautizo de Mateo Idai','DESCRIPTION:Celebración del bautizo de Mateo Idai. Consulta la invitación para ver las ubicaciones.','END:VEVENT','END:VCALENDAR'].join('\r\n');
   const blob=new Blob([ics],{type:'text/calendar;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');
   a.href=url;a.download='Bautizo-Mateo-Idai.ics';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
 }
 document.querySelectorAll('[data-calendar]').forEach(b=>b.addEventListener('click',addCalendar));
 const target=new Date('2026-12-19T12:00:00-06:00').getTime(),ids=['days','hours','minutes','seconds'],message=document.getElementById('countdown-message');
 function update(){const diff=target-Date.now();if(diff<=0){ids.forEach(id=>document.getElementById(id).textContent='0');message.textContent=diff>-86400000?'¡Hoy celebramos el bautizo de Mateo Idai!':'Gracias por acompañarnos en este día tan especial.';return;}
 const v=[Math.floor(diff/86400000),Math.floor(diff%86400000/3600000),Math.floor(diff%3600000/60000),Math.floor(diff%60000/1000)];ids.forEach((id,i)=>document.getElementById(id).textContent=String(v[i]).padStart(2,'0'));}
 update();setInterval(update,1000);
 const layer=document.getElementById('sparkles'),colors=['#d7b84f','#8eafc6','#a98768'];
 for(let i=0;i<42;i++){const s=document.createElement('i');s.className='star';s.style.left=Math.random()*100+'%';s.style.color=colors[i%3];s.style.animationDuration=8+Math.random()*12+'s';s.style.animationDelay=-Math.random()*20+'s';s.style.setProperty('--drift',(Math.random()-.5)*110+'px');s.style.width=s.style.height=3+Math.random()*4+'px';layer.appendChild(s);}
 for(let i=0;i<64;i++){const s=document.createElement('i');s.className='twinkle';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.color=colors[i%3];s.style.width=s.style.height=1.5+Math.random()*3+'px';s.style.animationDelay=(-Math.random()*3)+'s';layer.appendChild(s);}
})();
</script>
</body></html>
