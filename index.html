<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f5ef">
<meta name="description" content="Mi Bautizo Mateo Idai. Acompáñanos a celebrar este día tan especial.">
<title>Mi Bautizo Mateo Idai</title>
<meta property="og:type" content="website">
<meta property="og:title" content="Mi Bautizo Mateo Idai">
<meta property="og:description" content="Acompáñanos a celebrar el bautizo de Mateo Idai.">
<meta property="og:url" content="https://fezojdesing.github.io/Mi_Bautizo_Mateo_Idai/">
<meta property="og:image" content="https://fezojdesing.github.io/Mi_Bautizo_Mateo_Idai/portada%20whats.jpg">
<meta property="og:image:secure_url" content="https://fezojdesing.github.io/Mi_Bautizo_Mateo_Idai/portada%20whats.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:alt" content="Mi Bautizo Mateo Idai">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Mi Bautizo Mateo Idai">
<meta name="twitter:description" content="Acompáñanos a celebrar el bautizo de Mateo Idai.">
<meta name="twitter:image" content="https://fezojdesing.github.io/Mi_Bautizo_Mateo_Idai/portada%20whats.jpg">
<style>
:root{--gold:#d7b84f;--blue:#8eafc6;--brown:#a98768}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#f8f5ef}
body{font-family:Arial,sans-serif}
#sparkles{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:30}
.star,.transition-star{position:absolute;top:-18px;border-radius:50%;pointer-events:none;box-shadow:0 0 12px 3px currentColor}
.star{opacity:0;animation:fall linear infinite}
@keyframes fall{0%{transform:translate3d(0,-5vh,0) scale(.45);opacity:0}12%{opacity:.9}82%{opacity:.65}100%{transform:translate3d(var(--drift),110vh,0) scale(1.2) rotate(180deg);opacity:0}}
.transition-star{top:-8vh;animation:shower linear forwards;box-shadow:0 0 16px 4px currentColor}
@keyframes shower{0%{transform:translate3d(0,-8vh,0) scale(.3);opacity:0}12%{opacity:1}100%{transform:translate3d(var(--drift),112vh,0) scale(1.3) rotate(240deg);opacity:0}}
.screen{display:none;width:100%;min-height:100svh;padding:12px 0 24px;position:relative}
.screen.active{display:flex;justify-content:flex-start;align-items:center;flex-direction:column;animation:appear .45s ease both}
@keyframes appear{from{opacity:.55}to{opacity:1}}
.art-wrap{position:relative;width:min(100vw,560px);line-height:0}
#details .art-wrap{width:min(100vw,426px)}
.art{display:block;width:100%;height:auto}
.hotspot{position:absolute;display:block;padding:0;margin:0;border:0;background:transparent;border-radius:999px;cursor:pointer;line-height:normal;text-decoration:none;-webkit-tap-highlight-color:transparent}
.hotspot:focus-visible{outline:3px solid #d6a942;outline-offset:3px;background:#ffffff20}
#cover-open{left:23.5%;top:58.3%;width:53%;height:4.1%}
#cover-calendar{left:23.5%;top:63.1%;width:53%;height:4.1%}
#church-map{left:27%;top:59.1%;width:46%;height:2.2%}
#reception-map{left:27%;top:74.6%;width:46%;height:2.2%}
#fezoj-link{left:23%;top:95.6%;width:54%;height:2.4%}
.countdown-overlay{position:absolute;left:19%;top:8.15%;width:62%;height:3.3%;display:flex;align-items:center;justify-content:space-around;color:#fff;pointer-events:none;text-shadow:0 1px 3px #275b83}
.count-unit{display:flex;flex-direction:column;align-items:center;min-width:0}
.count-number{font:700 clamp(12px,3.4vw,17px)/1 Georgia,serif;letter-spacing:-.03em}
.count-label{font:600 clamp(6px,1.55vw,8px)/1.2 Arial,sans-serif;text-transform:uppercase;letter-spacing:.04em;margin-top:2px}
@media(min-width:700px){.screen{padding-top:18px}.count-number{font-size:17px}.count-label{font-size:8px}}
@media(prefers-reduced-motion:reduce){.star,.transition-star{display:none}.screen.active{animation:none}}
</style>
</head>
<body>
<div id="sparkles" aria-hidden="true"></div>

<main>
<section class="screen active" id="cover" aria-label="Portada">
  <div class="art-wrap">
    <img class="art" src="./portada_1.jpg" alt="Portada de Mi Bautizo Mateo Idai" fetchpriority="high">
    <button class="hotspot" id="cover-open" type="button" aria-label="Toca para abrir la invitación"></button>
    <button class="hotspot" id="cover-calendar" type="button" aria-label="Agendar evento"></button>
  </div>
</section>

<section class="screen" id="details" aria-label="Detalles del bautizo" aria-hidden="true">
  <div class="art-wrap">
    <img class="art" src="./datos.jpg" alt="Información del bautizo de Mateo Idai" loading="eager">
    <div class="countdown-overlay" aria-label="Cuenta regresiva para el bautizo">
      <div class="count-unit"><span class="count-number" id="days">—</span><span class="count-label">Días</span></div>
      <div class="count-unit"><span class="count-number" id="hours">—</span><span class="count-label">Hrs</span></div>
      <div class="count-unit"><span class="count-number" id="minutes">—</span><span class="count-label">Min</span></div>
      <div class="count-unit"><span class="count-number" id="seconds">—</span><span class="count-label">Seg</span></div>
    </div>
    <a class="hotspot" id="church-map" href="https://maps.app.goo.gl/ys9SZmy4LGqBp9BU8" target="_blank" rel="noopener noreferrer" aria-label="Ver ubicación de la iglesia"></a>
    <a class="hotspot" id="reception-map" href="https://maps.app.goo.gl/JEPxGaJPfs8Sdn3x7" target="_blank" rel="noopener noreferrer" aria-label="Ver ubicación de la recepción"></a>
    <a class="hotspot" id="fezoj-link" href="https://fezojdesing.github.io/fezoj_studio/" target="_blank" rel="noopener noreferrer" aria-label="Cotiza tu invitación con Fezoj"></a>
  </div>
</section>
</main>

<script>
(() => {
  const cover = document.getElementById('cover');
  const details = document.getElementById('details');
  const layer = document.getElementById('sparkles');
  const palette = ['#d7b84f','#8eafc6','#a98768'];

  // Unas cuantas estrellas grandes que cruzan toda la pantalla de arriba hacia abajo.
  for (let i = 0; i < 18; i++) {
    const star = document.createElement('i');
    star.className = 'star';
    star.style.left = (Math.random() * 100) + '%';
    star.style.color = palette[i % palette.length];
    star.style.width = star.style.height = (7 + Math.random() * 6) + 'px';
    star.style.animationDuration = (11 + Math.random() * 9) + 's';
    star.style.animationDelay = (-Math.random() * 20) + 's';
    star.style.setProperty('--drift', ((Math.random() - .5) * 80) + 'px');
    layer.appendChild(star);
  }

  function starShower() {
    for (let i = 0; i < 38; i++) {
      const star = document.createElement('i');
      star.className = 'transition-star';
      star.style.left = (Math.random() * 100) + '%';
      star.style.color = palette[i % palette.length];
      star.style.width = star.style.height = (4 + Math.random() * 5) + 'px';
      star.style.animationDuration = (.9 + Math.random() * .9) + 's';
      star.style.animationDelay = (Math.random() * .25) + 's';
      star.style.setProperty('--drift', ((Math.random() - .5) * 130) + 'px');
      layer.appendChild(star);
      star.addEventListener('animationend', () => star.remove(), {once:true});
    }
  }

  function showPage(page, animate = true) {
    const isDetails = page === 'details';
    cover.classList.toggle('active', !isDetails);
    details.classList.toggle('active', isDetails);
    cover.setAttribute('aria-hidden', String(isDetails));
    details.setAttribute('aria-hidden', String(!isDetails));
    if (animate) starShower();
    window.scrollTo({top:0,behavior:'instant'});
  }

  document.getElementById('cover-open').addEventListener('click', () => {
    history.pushState({page:'details'}, '', '#detalles');
    showPage('details');
  });

  // El calendario se descarga desde el botón que ya está dibujado en la portada.
  document.getElementById('cover-calendar').addEventListener('click', () => {
    const lines = [
      'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Fezoj//Bautizo Mateo Idai//ES',
      'CALSCALE:GREGORIAN','BEGIN:VEVENT','UID:mateo-idai-bautizo-20261219@fezoj',
      'DTSTAMP:20261113T000000Z','DTSTART;TZID=America/Mexico_City:20261219T120000',
      'DTEND;TZID=America/Mexico_City:20261219T130000','SUMMARY:Bautizo de Mateo Idai',
      'DESCRIPTION:Celebración del bautizo de Mateo Idai.','END:VEVENT','END:VCALENDAR'
    ];
    const blob = new Blob([lines.join('\r\n')], {type:'text/calendar;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = 'Bautizo-Mateo-Idai.ics';
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(url);
  });

  // Regresar se hace con el botón Atrás del navegador/teléfono, sin añadir otro botón visual.
  window.addEventListener('popstate', () => {
    showPage(location.hash === '#detalles' ? 'details' : 'cover');
  });

  const target = new Date('2026-12-19T12:00:00-06:00').getTime();
  const ids = ['days','hours','minutes','seconds'];
  function updateCountdown() {
    const diff = target - Date.now();
    const values = diff <= 0 ? [0,0,0,0] : [
      Math.floor(diff / 86400000),
      Math.floor((diff % 86400000) / 3600000),
      Math.floor((diff % 3600000) / 60000),
      Math.floor((diff % 60000) / 1000)
    ];
    ids.forEach((id,index) => {
      const node = document.getElementById(id);
      if (node) node.textContent = String(values[index]).padStart(2,'0');
    });
  }
  updateCountdown();
  window.setInterval(updateCountdown, 1000);

  if (location.hash === '#detalles') showPage('details', false);
})();
</script>
</body>
</html>
